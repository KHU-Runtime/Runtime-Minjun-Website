<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아리 활동 | RUNTIME;</title>
  <meta name="description" content="런타임의 기초반, 심화반, 자격증 & 스터디, 공모전 활동">
  <link rel="icon" href="images/favicon.png" type="image/png">

  <!-- 웹폰트 (인터넷이 없으면 시스템 글꼴로 자동 대체됩니다) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="activity">

  <!-- 헤더: js/layout.js 가 채워 넣습니다 -->
  <div id="siteHeader"></div>

  <main>
    <!-- 상단 배너: js/layout.js 가 채워 넣습니다 -->
    <section id="pageHero"></section>

    <section class="section activity activity--page">
      <div class="container">
        <h2 class="block-title block-title--light reveal"><span>PROGRAM</span>주요 활동</h2>
        <div class="act reveal" id="act">
          <div class="act__stage" id="actStage" aria-live="polite"></div>
          <div class="act__controls">
            <button type="button" class="act__arrow" id="actPrev" aria-label="이전 활동">‹</button>
            <ul class="act__list" id="actList" role="tablist" aria-label="활동 목록"></ul>
            <button type="button" class="act__arrow" id="actNext" aria-label="다음 활동">›</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section schedule-sec">
      <div class="container">
        <h2 class="block-title reveal"><span>SCHEDULE</span><b id="scheduleTitle">활동 일정</b></h2>
        <ol class="terms reveal" id="schedule"></ol>
        <p class="terms__note reveal" id="scheduleNote"></p>
      </div>
    </section>

    <!-- 이전/다음 화면 버튼 -->
    <nav id="pageNav" aria-label="화면 이동"></nav>
  </main>

  <!-- 푸터: js/layout.js 가 채워 넣습니다 -->
  <div id="siteFooter"></div>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
