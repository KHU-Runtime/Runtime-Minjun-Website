<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아리 지원 | RUNTIME;</title>
  <meta name="description" content="런타임 신규 부원 모집 안내">
  <link rel="icon" href="images/favicon.png" type="image/png">

  <!-- 웹폰트 (인터넷이 없으면 시스템 글꼴로 자동 대체됩니다) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="recruit">

  <!-- 헤더: js/layout.js 가 채워 넣습니다 -->
  <div id="siteHeader"></div>

  <main>
    <!-- 상단 배너: js/layout.js 가 채워 넣습니다 -->
    <section id="pageHero"></section>

    <section class="section recruit">
      <div class="container">
        <div data-recruit-banner></div>
        <div data-cta></div>

        <div class="recruit__block reveal">
          <h3 class="block-title"><span>WHO</span>모집 대상</h3>
          <ul class="targets" id="targetList"></ul>
        </div>

        <div class="recruit__block reveal">
          <h3 class="block-title"><span>HOW</span>지원 방법</h3>
          <ol class="steps" id="stepList"></ol>
        </div>

        <p class="recruit__note reveal">지원 관련 문의는 인스타그램 DM으로 남겨 주세요.</p>
      </div>
    </section>

    <!-- 이전/다음 화면 버튼 -->
    <nav id="pageNav" aria-label="화면 이동"></nav>
  </main>

  <!-- 푸터: js/layout.js 가 채워 넣습니다 -->
  <div id="siteFooter"></div>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
